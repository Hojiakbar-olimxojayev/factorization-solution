<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>
      Integer Factorization Suite — Fermat, Dixon, Pollard ρ, Lenstra ECM
    </title>

    <meta
      name="description"
      content="Interactive step-by-step visualisation of integer factorization algorithms: Fermat, Dixon, Pollard ρ and Lenstra ECM. Complete prime factorization, algorithm comparison, 30+ digit numbers, EN/UZ languages and dark mode."
    />
    <meta
      name="keywords"
      content="integer factorization, Fermat method, Dixon method, Pollard rho, Lenstra ECM, elliptic curve factorization, cryptography, RSA, faktorizatsiya, kriptografiya"
    />
    <meta name="author" content="Your Name" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://factorization-solution.vercel.app/" />

    <meta
      name="theme-color"
      content="#4F46E5"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0B0F19"
      media="(prefers-color-scheme: dark)"
    />
    <meta name="color-scheme" content="light dark" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Integer Factorization Suite" />
    <meta
      property="og:title"
      content="Integer Factorization Suite — step-by-step visualisation"
    />
    <meta
      property="og:description"
      content="Watch Fermat, Dixon, Pollard ρ and Lenstra ECM factor big integers into primes, one step at a time, and compare them on the same input."
    />
    <meta
      property="og:url"
      content="https://factorization-solution.vercel.app/"
    />
    <meta
      property="og:image"
      content="https://factorization-solution.vercel.app/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="uz_UZ" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Integer Factorization Suite — step-by-step visualisation"
    />
    <meta
      name="twitter:description"
      content="Fermat, Dixon, Pollard ρ and Lenstra ECM with step-by-step verification and a comparison table."
    />
    <meta
      name="twitter:image"
      content="https://factorization-solution.vercel.app/og-image.png"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Integer Factorization Suite",
        "url": "https://factorization-solution.vercel.app/",
        "description": "Interactive step-by-step visualisation of Fermat, Dixon, Pollard and Lenstra ECM factorization algorithms.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any (web browser)",
        "inLanguage": ["en", "uz"],
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link rel="stylesheet" href="css/style.css?v=5" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="logo">n = p·q</div>
        <div>
          <h1 data-i18n="app_title"></h1>
          <p class="sub" data-i18n="app_sub"></p>
        </div>
      </div>
      <div class="toolbar">
        <div class="seg" role="group" aria-label="Language">
          <button class="seg-btn active" data-lang="en">EN</button>
          <button class="seg-btn" data-lang="uz">UZ</button>
        </div>
        <button id="themeBtn" class="icon-btn" data-i18n-title="theme_toggle">
          🌙
        </button>
      </div>
    </header>

    <main class="container">
      <nav class="tabs" id="tabs">
        <button
          class="tab active"
          data-algo="fermat"
          data-i18n="tab_fermat"
        ></button>
        <button class="tab" data-algo="dixon" data-i18n="tab_dixon"></button>
        <button
          class="tab"
          data-algo="pollard"
          data-i18n="tab_pollard"
        ></button>
        <button class="tab" data-algo="ecm" data-i18n="tab_ecm"></button>
      </nav>

      <div class="viewswitch" role="tablist">
        <button
          id="viewTask"
          class="view-btn active"
          data-view="task"
          data-i18n="view_task"
        ></button>
        <button id="viewLog" class="view-btn" data-view="log" disabled>
          <span data-i18n="view_log"></span
          ><span id="logBadge" class="badge" hidden></span>
        </button>
        <button
          id="viewCmp"
          class="view-btn"
          data-view="compare"
          data-i18n="view_compare"
          disabled
        ></button>
      </div>

      <!-- ================= TASK VIEW ================= -->
      <section id="taskView">
        <div class="card" id="inputCard">
          <h2 data-i18n="sec_input"></h2>
          <p id="algoDesc" class="desc"></p>

          <div class="fields">
            <div class="field wide">
              <label for="nInput" data-i18n="lbl_n"></label>
              <input
                id="nInput"
                type="text"
                inputmode="numeric"
                autocomplete="off"
                data-i18n-ph="ph_n"
              />
              <small id="nHint" class="hint"></small>
            </div>
            <div id="extraFields" class="extra"></div>
          </div>

          <div class="actions">
            <button
              id="suggestBtn"
              class="btn"
              data-i18n="btn_suggest"
            ></button>
            <button
              id="runBtn"
              class="btn primary"
              data-i18n="btn_run"
            ></button>
            <button
              id="compareBtn"
              class="btn"
              data-i18n="btn_compare"
            ></button>
            <button id="clearBtn" class="btn" data-i18n="btn_clear"></button>
          </div>
          <div id="msg" class="msg" role="alert"></div>
        </div>

        <div id="resultCard" class="card result" hidden></div>
      </section>

      <!-- ================= LOG VIEW ================= -->
      <section id="logView" hidden>
        <div class="stickbar">
          <div class="bar-top">
            <button id="backBtn" class="btn"></button>
            <div id="logSummary" class="log-summary"></div>
          </div>
          <div class="controls">
            <button id="prevBtn" class="btn" data-i18n="ctl_prev"></button>
            <button
              id="nextBtn"
              class="btn primary"
              data-i18n="ctl_next"
            ></button>
            <button id="playBtn" class="btn"></button>
            <button id="allBtn" class="btn" data-i18n="ctl_all"></button>
            <button
              id="restartBtn"
              class="btn"
              data-i18n="ctl_restart"
            ></button>
            <button
              id="collapseBtn"
              class="btn"
              data-i18n="collapse_all"
            ></button>
            <button id="expandBtn" class="btn" data-i18n="expand_all"></button>
            <label class="speed">
              <span data-i18n="lbl_speed"></span>
              <select id="speed">
                <option value="1200" data-i18n="speed_slow"></option>
                <option value="600" data-i18n="speed_normal" selected></option>
                <option value="150" data-i18n="speed_fast"></option>
                <option value="25" data-i18n="speed_max"></option>
              </select>
            </label>
          </div>
          <div class="progress"><div id="bar"></div></div>
          <div id="progressText" class="progress-text"></div>
        </div>

        <div id="steps" class="steps"></div>
      </section>

      <!-- ================= COMPARE VIEW ================= -->
      <section id="compareView" hidden>
        <div class="card">
          <div class="cmp-head">
            <div>
              <h2 data-i18n="cmp_title"></h2>
              <p id="cmpSub" class="desc"></p>
            </div>
            <div class="cmp-actions">
              <button id="cmpBack" class="btn" data-i18n="back_task"></button>
              <button
                id="cmpRerun"
                class="btn primary"
                data-i18n="cmp_rerun"
              ></button>
            </div>
          </div>

          <div class="table-wrap">
            <table id="cmpTable" class="cmp-table"></table>
          </div>

          <div id="cmpSummary" class="cmp-summary"></div>
          <p class="note-soft" data-i18n="cmp_note"></p>
        </div>
      </section>
    </main>

    <button id="toTop" class="to-top" data-i18n-title="to_top" hidden>↑</button>

    <footer class="footer" data-i18n="footer"></footer>

    <script src="js/utils.js?v=5"></script>
    <script src="js/i18n.js?v=5"></script>
    <script src="js/fermat.js?v=5"></script>
    <script src="js/dixon.js?v=5"></script>
    <script src="js/pollard.js?v=5"></script>
    <script src="js/lenstra.js?v=5"></script>
    <script src="js/engine.js?v=5"></script>
    <script src="js/compare.js?v=5"></script>
    <script src="js/app.js?v=5"></script>
  </body>
</html>
